<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">DharmaCipher terminal interface</title>
  <desc id="desc">Animated dark terminal with scanning beam, blinking cursor, moving signal trace, and blue-gold cyber security styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#58a6ff" stroke-opacity=".075" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="298" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#26364d" stroke-width="2"/>
    <path d="M0 42H1000" stroke="#26364d"/>
    <circle cx="25" cy="22" r="5" fill="#ff5f57"/><circle cx="43" cy="22" r="5" fill="#febc2e"/><circle cx="61" cy="22" r="5" fill="#28c840"/>
    <text x="82" y="27" fill="#7f91aa" font-family="monospace" font-size="12">adi@DharmaCipher: ~/identity</text>
    <g font-family="monospace">
      <text x="54" y="93" fill="#58a6ff" font-size="13">$ whoami</text>
      <text x="54" y="147" fill="#e6edf3" font-size="42" font-weight="700" letter-spacing="3">DHARMACIPHER</text>
      <text x="57" y="177" fill="#d6b15e" font-size="14" letter-spacing="2">ADI ZALA // CYBERSECURITY + INTELLIGENCE</text>
      <text x="57" y="218" fill="#8b9bb0" font-size="13">RECONNAISSANCE  •  OSINT  •  SECURITY AUTOMATION</text>
      <text x="57" y="251" fill="#58a6ff" font-size="13">[ SYSTEM READY ]</text>
      <rect x="175" y="239" width="9" height="16" fill="#58a6ff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(710 82)">
      <circle cx="105" cy="72" r="64" fill="none" stroke="#58a6ff" stroke-opacity=".18" stroke-width="1"/>
      <circle cx="105" cy="72" r="47" fill="none" stroke="#d6b15e" stroke-opacity=".45" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" from="0 105 72" to="360 105 72" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="105" cy="72" r="30" fill="#0b1220" stroke="#58a6ff" stroke-opacity=".75" filter="url(#glow)"/>
      <path d="M105 51L121 60V79L105 89L89 79V60Z" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
      <path d="M105 51V89M89 60L121 79M121 60L89 79" stroke="#d6b15e" stroke-opacity=".85" stroke-width="1.3"/>
      <circle cx="105" cy="72" r="4" fill="#d6b15e" filter="url(#glow)"/>
      <path d="M30 156H180" stroke="#26364d"/>
      <text x="105" y="177" fill="#7f91aa" font-family="monospace" font-size="10" text-anchor="middle">SIGNAL // ACTIVE</text>
      <path d="M28 197L45 197L52 184L61 211L71 190L80 197L94 197L101 178L111 215L122 197L139 197L148 187L158 197L182 197" fill="none" stroke="#58a6ff" stroke-width="1.8" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="0" y="-45" width="1000" height="42" fill="url(#beam)">
      <animate attributeName="y" values="-45;310;-45" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1000" height="300" fill="#58a6ff" opacity=".018">
      <animate attributeName="opacity" values=".005;.035;.005" dur="4s" repeatCount="indefinite"/>
    </rect>
    <path d="M20 285H980" stroke="#d6b15e" stroke-opacity=".55"/>
    <text x="28" y="278" fill="#63758d" font-family="monospace" font-size="10">DUTY // DISCIPLINE // CURIOSITY</text>
    <text x="972" y="278" fill="#63758d" font-family="monospace" font-size="10" text-anchor="end">WATFORD, UK</text>
  </g>
</svg>