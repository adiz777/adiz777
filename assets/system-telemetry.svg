<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="126" viewBox="0 0 1000 126" role="img" aria-labelledby="t d">
<title id="t">DharmaCipher system telemetry</title><desc id="d">Animated security system status with pulsing indicators and moving progress bars.</desc>
<defs><linearGradient id="b"><stop stop-color="#080d18"/><stop offset="1" stop-color="#101b2c"/></linearGradient><linearGradient id="scan"><stop stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".85"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs>
<rect width="1000" height="126" rx="12" fill="url(#b)" stroke="#26364d"/>
<g font-family="monospace">
<text x="24" y="26" fill="#d6b15e" font-size="11" letter-spacing="2">LIVE SYSTEM TELEMETRY</text>
<g transform="translate(24 46)">
<text fill="#8b9bb0" font-size="11">RECON</text><rect x="0" y="13" width="215" height="7" rx="3" fill="#202c3d"/><rect x="0" y="13" width="178" height="7" rx="3" fill="#58a6ff"><animate attributeName="width" values="130;192;154;178;130" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="205" cy="16" r="3" fill="#58a6ff"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(275 46)">
<text fill="#8b9bb0" font-size="11">OSINT</text><rect x="0" y="13" width="215" height="7" rx="3" fill="#202c3d"/><rect x="0" y="13" width="142" height="7" rx="3" fill="#d6b15e"><animate attributeName="width" values="115;168;128;142;115" dur="6s" repeatCount="indefinite"/></rect>
<circle cx="205" cy="16" r="3" fill="#d6b15e"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(526 46)">
<text fill="#8b9bb0" font-size="11">AUTOMATION</text><rect x="0" y="13" width="215" height="7" rx="3" fill="#202c3d"/><rect x="0" y="13" width="188" height="7" rx="3" fill="#58a6ff"><animate attributeName="width" values="160;200;174;188;160" dur="4.5s" repeatCount="indefinite"/></rect>
<circle cx="205" cy="16" r="3" fill="#58a6ff"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(777 49)">
<circle cx="8" cy="8" r="5" fill="#3fb950"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
<text x="22" y="12" fill="#3fb950" font-size="11">READY</text>
<text x="0" y="35" fill="#64748b" font-size="10">BUILD / LEARN / REPEAT</text>
</g>
</g>
<rect x="-220" y="0" width="190" height="126" fill="url(#scan)" opacity=".12"><animate attributeName="x" values="-220;1030;-220" dur="8s" repeatCount="indefinite"/></rect>
</svg>